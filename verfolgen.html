<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestellung verfolgen – Pizzeria Pinocchio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f6f5f3;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px;
      color: #16181b;
    }
    .karte {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.06);
      padding: 44px 40px;
      max-width: 460px;
      width: 100%;
    }
    .marke {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      color: #888;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 0.02em;
    }

    /* ===== Fortschritt ===== */
    .fortschritt {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
    }
    .schritt { display: flex; flex-direction: column; align-items: center; width: 84px; }
    .schritt .punkt {
      width: 13px; height: 13px;
      border-radius: 50%;
      background: #e2e2e2;
      margin-bottom: 8px;
    }
    .schritt.erreicht .punkt { background: #b3261e; }
    .schritt .label { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 0.03em; text-align: center; }
    .schritt.erreicht .label { color: #16181b; font-weight: 600; }
    .linie { flex: 1; height: 2px; background: #e2e2e2; margin: 0 -2px 22px; max-width: 60px; }
    .linie.erreicht { background: #b3261e; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      text-align: center;
      margin-bottom: 8px;
    }
    .unterzeile {
      text-align: center;
      color: #666;
      font-size: 14.5px;
      line-height: 1.6;
      margin-bottom: 4px;
    }

    .eta-box {
      background: #faf5f0;
      border: 1px solid #ecdfd0;
      border-radius: 12px;
      padding: 22px;
      margin: 26px 0;
      text-align: center;
    }
    .eta-box .zeile-1 { font-size: 15px; color: #444; margin-bottom: 4px; }
    .eta-box .zeile-2 { font-size: 13.5px; color: #999; }

    .bestellart-zeile {
      text-align: center;
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #b3261e;
      margin-bottom: 6px;
    }

    .artikel-liste {
      margin-top: 30px;
      border-top: 1px solid #eee;
      padding-top: 18px;
    }
    .artikel-liste .zeile {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #444;
      margin-bottom: 7px;
    }
    .artikel-liste .gesamt-zeile {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 15px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
      color: #16181b;
    }

    .fuss-zeile { text-align: center; margin-top: 30px; }
    .back-btn {
      display: inline-block;
      color: #16181b;
      text-decoration: none;
      padding: 12px 26px;
      border: 1.5px solid #16181b;
      border-radius: 40px;
      font-size: 13.5px;
      font-weight: 600;
    }
    .back-btn:hover { background: #16181b; color: #fff; }
    .telefon-hinweis {
      margin-top: 16px;
      font-size: 12.5px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="karte" id="karte">
    <div class="marke">Pizzeria Pinocchio</div>
    <div id="inhalt">
      <h1>Bestellung wird geladen</h1>
      <p class="unterzeile">Einen Moment bitte …</p>
    </div>
  </div>

<script src="config.js"></script>
<script>
function holeOrderId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id") || params.get("order_id");
}

function formatiereUhrzeit(datum) {
  return datum.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function formatiereEuro(zahl) {
  return zahl.toFixed(2).replace('.', ',') + ' €';
}

async function ladeStatus() {
  const orderId = holeOrderId();
  const inhalt = document.getElementById("inhalt");

  if (!orderId) {
    inhalt.innerHTML = `
      <h1>Kein Bestellzettel gefunden</h1>
      <p class="unterzeile">Der Link scheint unvollständig zu sein. Bitte nutze den Link, den du direkt nach deiner Bestellung erhalten hast.</p>
    `;
    return;
  }

  try {
    const res = await fetch(`${BACKEND_URL}/status/${orderId}`);
    if (!res.ok) {
      inhalt.innerHTML = `
        <h1>Bestellung nicht gefunden</h1>
        <p class="unterzeile">Wir konnten diese Bestellung nicht finden. Bitte prüfe den Link oder ruf uns kurz an.</p>
        <p class="telefon-hinweis">Telefon: 02595 7688</p>
      `;
      return;
    }
    const daten = await res.json();
    zeigeStatus(daten);
  } catch (e) {
    inhalt.innerHTML = `
      <h1>Verbindung nicht möglich</h1>
      <p class="unterzeile">Wir konnten den Status gerade nicht laden. Diese Seite versucht es automatisch weiter.</p>
    `;
  }
}

function fortschrittHtml(status) {
  const schritte = [
    { key: "eingegangen", label: "Eingegangen" },
    { key: "bestaetigt", label: "Bestätigt" },
    { key: "fertig", label: "Fertig" },
  ];
  const reihenfolge = ["eingegangen", "bestaetigt", "fertig"];
  const aktuellerIndex = reihenfolge.indexOf(status);

  return `
    <div class="fortschritt">
      ${schritte.map((s, i) => `
        ${i > 0 ? `<div class="linie ${i <= aktuellerIndex ? 'erreicht' : ''}"></div>` : ''}
        <div class="schritt ${i <= aktuellerIndex ? 'erreicht' : ''}">
          <div class="punkt"></div>
          <div class="label">${s.label}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function zeigeStatus(daten) {
  const inhalt = document.getElementById("inhalt");
  const istAbholung = daten.bestellart === "abholung";
  const bestellartText = istAbholung ? "Abholung" : "Lieferung";

  let kopf = "";
  if (daten.status === "eingegangen") {
    kopf = `
      <h1>Bestellung eingegangen</h1>
      <p class="unterzeile">Wir bestätigen in Kürze die voraussichtliche ${istAbholung ? 'Abholzeit' : 'Lieferzeit'}. Diese Seite aktualisiert sich automatisch.</p>
    `;
  } else if (daten.status === "bestaetigt") {
    const gesetztUm = new Date(daten.eta_gesetzt_um);
    const fertigUm = new Date(gesetztUm.getTime() + daten.eta_minuten * 60000);
    const restMinuten = Math.max(0, Math.round((fertigUm - new Date()) / 60000));

    kopf = `
      <h1>Bestellung bestätigt</h1>
      <div class="eta-box">
        <div class="zeile-1">${istAbholung ? 'Voraussichtliche Abholzeit' : 'Voraussichtliche Lieferzeit'}: ca. ${restMinuten > 0 ? restMinuten : 0} Minuten</div>
        <div class="zeile-2">${istAbholung ? 'Voraussichtlich abholbereit gegen' : 'Voraussichtlich gegen'} ${formatiereUhrzeit(fertigUm)} Uhr</div>
      </div>
    `;
  } else if (daten.status === "fertig") {
    kopf = istAbholung
      ? `<h1>Bestellung abholbereit</h1><p class="unterzeile">Deine Bestellung kann bei uns abgeholt werden.</p>`
      : `<h1>Bestellung unterwegs</h1><p class="unterzeile">Deine Bestellung ist unterwegs zu dir.</p>`;
  }

  const artikelHtml = daten.artikel
    .filter(a => a.preis !== undefined)
    .map(a => `
      <div class="zeile"><span>${a.name}</span><span>${formatiereEuro(a.preis)}</span></div>
    `).join('');

  inhalt.innerHTML = `
    <div class="bestellart-zeile">${bestellartText}</div>
    ${fortschrittHtml(daten.status)}
    ${kopf}
    <div class="artikel-liste">
      ${artikelHtml}
      <div class="gesamt-zeile"><span>Gesamt</span><span>${formatiereEuro(daten.gesamt)}</span></div>
    </div>
    <div class="fuss-zeile">
      <a href="index.html" class="back-btn">Zurück zur Speisekarte</a>
      <p class="telefon-hinweis">Fragen? Telefon: 02595 7688</p>
    </div>
  `;
}

ladeStatus();
setInterval(ladeStatus, 8000);
</script>
</body>
</html>
