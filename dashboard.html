<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestellterminal – Pizzeria Pinocchio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: #e9ebee;
      color: #16181b;
    }

    /* ===== Login ===== */
    #login-bereich {
      max-width: 360px;
      margin: 100px auto;
      background: #fff;
      border-radius: 14px;
      padding: 36px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    #login-bereich h1 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin-bottom: 22px;
      text-align: center;
    }
    #login-bereich input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 16px;
    }
    #login-bereich button {
      width: 100%;
      padding: 14px;
      background: #b3261e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    #login-fehler {
      color: #b3261e;
      font-size: 13px;
      margin-bottom: 10px;
      display: none;
    }

    /* ===== Kopfleiste ===== */
    #app-kopf {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #16181b;
      color: #fff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #app-kopf .marke {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    #app-kopf .marke .unter { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; color: #9aa0a6; display: block; }
    #kopf-rechts { display: flex; align-items: center; gap: 10px; }
    .kopf-btn {
      display: flex; align-items: center; gap: 7px;
      background: #2a2d31;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      color: #e8eaed;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .kopf-btn:hover { background: #35383d; }
    .kopf-btn.aus { color: #7a7f85; }
    .kopf-btn svg { width: 16px; height: 16px; }

    /* ===== Layout ===== */
    #inhalt { padding: 24px 28px 60px; max-width: 1400px; margin: 0 auto; }
    .abschnitt { margin-bottom: 36px; }
    .abschnitt-titel {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }
    .abschnitt-titel h2 {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #444;
    }
    .abschnitt-titel .anzahl {
      background: #16181b;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 20px;
    }
    .abschnitt-titel.neu h2 { color: #b3261e; }
    .abschnitt-titel.neu .anzahl { background: #b3261e; }

    .karten-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 18px;
    }

    /* ===== Bestell-Karte ===== */
    .karte {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }
    .karte.neu {
      border: 3px solid #b3261e;
      box-shadow: 0 4px 18px rgba(179,38,30,0.22);
    }
    .karte.zubereitung {
      border: 1px solid #dbe3dc;
    }

    .karte-kopf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .karte.neu .karte-kopf { background: #b3261e; color: #fff; }
    .karte.zubereitung .karte-kopf { background: #eef6f0; color: #1c5c33; }

    .bestellart-abzeichen {
      display: flex; align-items: center; gap: 8px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .bestellart-abzeichen svg { width: 20px; height: 20px; }

    .karte-kopf-status {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.92;
    }

    .karte-zeit {
      font-size: 12px;
      opacity: 0.85;
      text-align: right;
    }

    .karte-body { padding: 18px 20px 20px; }

    .kunde-name { font-size: 21px; font-weight: 700; margin-bottom: 10px; }

    .kontakt-zeilen { margin-bottom: 14px; }
    .kontakt-zeile {
      display: flex; align-items: flex-start; gap: 9px;
      font-size: 15px;
      color: #2a2d31;
      margin-bottom: 6px;
    }
    .kontakt-zeile svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 2px; color: #888; }
    .kontakt-zeile.hinweis { color: #8a4b12; font-style: italic; }

    .artikel-block {
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 4px;
    }
    .artikel-zeile {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 15.5px;
      color: #16181b;
      margin-bottom: 5px;
    }
    .artikel-zeile .menge { color: #999; margin-right: 4px; }
    .extra-zeile {
      display: flex; justify-content: space-between; gap: 8px;
      font-size: 13px;
      color: #888;
      padding-left: 24px;
      margin-bottom: 3px;
    }
    .liefer-zeile {
      display: flex; justify-content: space-between;
      font-size: 13.5px;
      color: #888;
      margin-top: 6px;
    }
    .summen-zeile {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
    .summen-zeile .betrag { font-size: 20px; font-weight: 800; }
    .zahlart-abzeichen {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .zahlart-abzeichen.bar { background: #eef2fb; color: #2b4a9e; }
    .zahlart-abzeichen.online { background: #eaf7ef; color: #1c5c33; }

    /* ===== Zeit-Auswahl (neue Bestellungen) ===== */
    .zeit-bereich { margin-top: 18px; }
    .zeit-hinweis { font-size: 12.5px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700; }
    .zeit-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .zeit-btn {
      background: #16181b;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 16px 8px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }
    .zeit-btn:hover { background: #33363b; }
    .zeit-eigene-zeile {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .zeit-eigene-zeile input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }
    .zeit-eigene-zeile button {
      background: #444;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    /* ===== In Zubereitung ===== */
    .eta-anzeige {
      margin-top: 16px;
      background: #f2faf5;
      border: 1px solid #cdebd7;
      border-radius: 10px;
      padding: 14px 16px;
    }
    .eta-anzeige .zeit-gross { font-size: 22px; font-weight: 800; color: #1c5c33; }
    .eta-anzeige .zeit-detail { font-size: 12.5px; color: #4d8a63; margin-top: 2px; }

    .fertig-btn {
      margin-top: 14px;
      width: 100%;
      background: #fff;
      color: #16181b;
      border: 1.5px solid #16181b;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .fertig-btn:hover { background: #16181b; color: #fff; }
    .fertig-btn svg { width: 16px; height: 16px; }

    .leer-hinweis {
      color: #999;
      font-size: 14.5px;
      padding: 18px 4px;
    }

    /* ===== Druck-Bereich: unsichtbar auf dem Bildschirm, erscheint nur beim Drucken ===== */
    #druck-bereich { display: none; }

    @media print {
      body * { visibility: hidden; }
      #druck-bereich, #druck-bereich * { visibility: visible; }
      #druck-bereich {
        display: block;
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        padding: 20px;
        font-family: 'Inter', sans-serif;
        color: #000;
      }
      #druck-zettel { max-width: 380px; margin: 0 auto; }
      #druck-zettel h2 {
        font-family: 'Playfair Display', serif;
        font-size: 20px;
        text-align: center;
        margin-bottom: 2px;
      }
      #druck-zettel .druck-bestellart {
        text-align: center;
        font-size: 16px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 6px 0 2px;
      }
      #druck-zettel .druck-unterzeile { text-align: center; font-size: 12px; color: #444; margin-bottom: 14px; }
      #druck-zettel .druck-trennlinie { border-top: 1px dashed #000; margin: 10px 0; }
      #druck-zettel .druck-zeile { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
      #druck-zettel .druck-extra { display: flex; justify-content: space-between; font-size: 12px; color: #333; padding-left: 20px; margin-bottom: 2px; }
      #druck-zettel .druck-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.03em; }
      #druck-zettel .druck-eta {
        margin-top: 14px;
        border: 2px solid #000;
        border-radius: 6px;
        padding: 10px;
        text-align: center;
        font-size: 18px;
        font-weight: 700;
      }
      #druck-zettel .druck-summe { font-size: 16px; font-weight: 700; margin-top: 8px; }
    }
  </style>
</head>
<body>

  <div id="login-bereich">
    <h1>Bestellterminal-Login</h1>
    <p id="login-fehler">Benutzername oder Passwort falsch.</p>
    <input type="text" id="login-user" placeholder="Benutzername">
    <input type="password" id="login-pass" placeholder="Passwort">
    <button onclick="einloggen()">Anmelden</button>
  </div>

  <div id="dashboard-bereich" style="display:none;">
    <header id="app-kopf">
      <div class="marke">
        Pizzeria Pinocchio
        <span class="unter">Bestellterminal</span>
      </div>
      <div id="kopf-rechts">
        <button class="kopf-btn" id="ton-toggle" onclick="tonUmschalten()"></button>
        <button class="kopf-btn" id="ausloggen-btn" onclick="ausloggen()"><i data-feather="log-out"></i><span>Abmelden</span></button>
      </div>
    </header>

    <div id="inhalt">
      <div class="abschnitt">
        <div class="abschnitt-titel neu">
          <h2>Neue Bestellungen</h2>
          <span class="anzahl" id="anzahl-neu">0</span>
        </div>
        <div class="karten-grid" id="liste-neu"></div>
      </div>

      <div class="abschnitt">
        <div class="abschnitt-titel">
          <h2>In Zubereitung</h2>
          <span class="anzahl" id="anzahl-zubereitung">0</span>
        </div>
        <div class="karten-grid" id="liste-zubereitung"></div>
      </div>
    </div>
  </div>

  <!-- Wird nur beim Drucken sichtbar (siehe @media print oben) -->
  <div id="druck-bereich"><div id="druck-zettel"></div></div>

<script src="config.js"></script>
<script>
let authHeader = null;
let bekannteIds = null;
let tonAktiv = true;
let audioCtx = null;
let letzteBestellungen = [];

// Ob der Bestellalarm freigeschaltet wurde. Das passiert beim Klick auf
// "Anmelden" (siehe einloggen()) - Browser verlangen dafür eine direkte
// Nutzeraktion, und der Login-Klick ist ohnehin nötig, liefert diese also
// "kostenlos" mit. Bleibt danach für die ganze Sitzung (bis Tab/Browser neu
// startet) aktiv.
let alarmAktiviert = false;
// Läuft, solange mindestens eine neue (unbestätigte) Bestellung wartet -
// wird sofort gestoppt, sobald keine mehr offen ist.
let alarmIntervalId = null;

const LIEFERKOSTEN_NAMEN = ["Lieferkosten"];

function symbolePlatzieren() {
  if (window.feather) feather.replace({ width: 16, height: 16, "stroke-width": 2.2 });
}

function audioFreischalten() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (AudioCtor) audioCtx = new AudioCtor();
  } else if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

// Deutlich hörbarer Dreiklang - bewusst länger/lauter als ein einzelner
// kurzer Ton, damit er im Betrieb (Küchenlärm, andere Tabs) nicht übergangen
// wird. Wird per Intervall wiederholt, solange Bestellungen unbestätigt sind.
function spieleBenachrichtigung() {
  if (!tonAktiv || !audioCtx) return;
  // Chrome/Edge versetzen einen AudioContext automatisch in "suspended", wenn
  // länger keine tatsächliche Ausgabe stattfand (Energiesparen) - das passiert
  // z.B. immer dann, wenn zwischen zwei Bestellungen mehr als ~30 Sekunden
  // Stille liegen. Ohne diesen Resume-Aufruf blieb der wiederholende Alarm
  // dann stumm, bis man erneut auf "Bestellalarm aktivieren" klickte. Ein
  // .resume() auf einen bereits einmal per Nutzeraktion freigeschalteten
  // Context ist erlaubt und braucht keine erneute Nutzeraktion.
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  const jetzt = audioCtx.currentTime;
  [{ t: 0, f: 880 }, { t: 0.16, f: 1175 }, { t: 0.32, f: 1480 }].forEach(ton => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = ton.f;
    gain.gain.setValueAtTime(0.0001, jetzt + ton.t);
    gain.gain.exponentialRampToValueAtTime(0.32, jetzt + ton.t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, jetzt + ton.t + 0.34);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(jetzt + ton.t);
    osc.stop(jetzt + ton.t + 0.36);
  });
}

function aktualisiereTonKnopf() {
  const btn = document.getElementById("ton-toggle");
  btn.innerHTML = (tonAktiv ? '<i data-feather="bell"></i>' : '<i data-feather="bell-off"></i>') +
    '<span>' + (tonAktiv ? 'Ton an' : 'Ton aus') + '</span>';
  btn.classList.toggle("aus", !tonAktiv);
  symbolePlatzieren();
}

function tonUmschalten() {
  tonAktiv = !tonAktiv;
  aktualisiereTonKnopf();
  if (tonAktiv) audioFreischalten();
}

// Startet/stoppt den wiederholenden Alarm je nachdem, ob noch unbestätigte
// ("neue") Bestellungen offen sind. Läuft weiter, bis die letzte davon
// angenommen (ETA gesetzt) wurde - dann stoppt er sofort.
function alarmStatusAktualisieren() {
  const anzahlNeu = letzteBestellungen.filter(b => b.status === "eingegangen").length;

  if (!alarmAktiviert || anzahlNeu === 0) {
    if (alarmIntervalId) {
      clearInterval(alarmIntervalId);
      alarmIntervalId = null;
    }
    return;
  }

  if (!alarmIntervalId) {
    alarmIntervalId = setInterval(spieleBenachrichtigung, 4000);
  }
}

function einloggen() {
  // Der Anmelden-Klick ist die ohnehin nötige Nutzeraktion: mit ihr wird der
  // AudioContext freigeschaltet und der Bestellalarm für die komplette
  // laufende Dashboard-Sitzung aktiviert - kein separater Aktivierungsknopf
  // mehr nötig. Muss synchron im gleichen Klick-Handler passieren, sonst
  // blockieren Browser die Audiofreischaltung.
  audioFreischalten();
  alarmAktiviert = true;
  const user = document.getElementById("login-user").value;
  const pass = document.getElementById("login-pass").value;
  authHeader = "Basic " + btoa(user + ":" + pass);
  ladeBestellungen(true);
}

function ausloggen() {
  authHeader = null;
  sessionStorage.removeItem("dashboardAuth");
  document.getElementById("dashboard-bereich").style.display = "none";
  document.getElementById("login-bereich").style.display = "block";
}

// Sicherheitsnetz für den Fall, dass die Sitzung NICHT über einen frischen
// Klick auf "Anmelden" zustande kam - z.B. wenn der Tab automatisch über
// sessionStorage wieder eingeloggt wird (siehe ganz unten) oder wenn Chrome
// den Tab im Hintergrund entladen und neu geladen hat. In diesen Fällen lief
// bislang NIE eine echte Nutzeraktion, also blieb alarmAktiviert für den Rest
// der Sitzung auf false stehen - das Dashboard sah normal aus (Bestellungen
// kamen an), aber der Alarm konnte nie klingeln, ohne dass das sichtbar war.
// Jeder Klick irgendwo im Dashboard ist eine echte, vom Browser akzeptierte
// Nutzeraktion, also nutzen wir den allerersten Klick nach dem Laden als
// nachträgliche Freischaltung - ganz ohne separaten Aktivierungsknopf. War
// bereits über einloggen() aktiviert, passiert hier einfach nichts Neues.
document.addEventListener("click", function () {
  audioFreischalten();
  if (!alarmAktiviert) {
    alarmAktiviert = true;
    alarmStatusAktualisieren();
  }
});

async function ladeBestellungen(istLoginVersuch) {
  if (!authHeader) return;

  try {
    const res = await fetch(`${BACKEND_URL}/dashboard/api/bestellungen`, {
      headers: { "Authorization": authHeader }
    });

    if (res.status === 401) {
      if (istLoginVersuch) {
        document.getElementById("login-fehler").style.display = "block";
      } else {
        ausloggen();
      }
      return;
    }

    sessionStorage.setItem("dashboardAuth", authHeader);
    document.getElementById("login-bereich").style.display = "none";
    document.getElementById("dashboard-bereich").style.display = "block";
    document.getElementById("login-fehler").style.display = "none";

    const bestellungen = await res.json();
    letzteBestellungen = bestellungen;

    const aktuelleIds = new Set(bestellungen.map(b => b.order_id));
    if (bekannteIds !== null) {
      const neueIds = bestellungen.filter(b => !bekannteIds.has(b.order_id));
      if (neueIds.length > 0) spieleBenachrichtigung();
    }
    bekannteIds = aktuelleIds;

    renderBestellungen(bestellungen);
    alarmStatusAktualisieren();
  } catch (e) {
    console.error("Fehler beim Laden:", e);
  }
}

function formatiereZeit(iso) {
  return new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function vorXMinuten(iso) {
  const min = Math.max(0, Math.floor((Date.now() - new Date(iso)) / 60000));
  if (min < 1) return "gerade eben";
  return `vor ${min} Min.`;
}

function euro(zahl) {
  return zahl.toFixed(2).replace('.', ',') + ' €';
}

function bestellartLabel(bestellart) {
  return bestellart === "abholung" ? "Abholung" : "Lieferung";
}

function bestellartIcon(bestellart) {
  return bestellart === "abholung" ? "shopping-bag" : "truck";
}

// Fasst die flache Artikelliste zu Hauptgerichten mit eingerückten Extras
// zusammen und trennt die Lieferkosten als eigene Zeile heraus.
function gruppiereArtikel(artikelListe) {
  let lieferkosten = null;
  const gruppen = [];

  artikelListe.forEach(a => {
    if (LIEFERKOSTEN_NAMEN.includes(a.name)) {
      lieferkosten = a;
      return;
    }
    const istExtra = a.name.startsWith("Extra");
    const letzte = gruppen[gruppen.length - 1];
    if (istExtra && letzte) {
      letzte.extras.push(a);
    } else {
      gruppen.push({ name: a.name, preis: a.preis, extras: [], menge: 1 });
    }
  });

  const zusammengefasst = [];
  gruppen.forEach(g => {
    const signatur = g.name + '|' + g.extras.map(e => e.name).sort().join(',');
    const letzte = zusammengefasst[zusammengefasst.length - 1];
    const letzteSignatur = letzte ? letzte.name + '|' + letzte.extras.map(e => e.name).sort().join(',') : null;
    if (letzte && letzteSignatur === signatur) {
      letzte.menge += 1;
    } else {
      zusammengefasst.push(g);
    }
  });

  return { gruppen: zusammengefasst, lieferkosten };
}

function baueArtikelHtml(gruppen, lieferkosten, zeilenKlasse, extraKlasse) {
  const artikelHtml = gruppen.map(g => {
    const einzelpreis = g.preis + g.extras.reduce((s, e) => s + e.preis, 0);
    const extrasHtml = g.extras.map(e =>
      `<div class="${extraKlasse}"><span>+ ${e.name.replace(/^Extra(\s\[\w+\])?:\s*/, '')}</span><span>${euro(e.preis)}</span></div>`
    ).join('');
    return `
      <div class="${zeilenKlasse}"><span><span class="menge">${g.menge}×</span>${g.name}</span><span>${euro(einzelpreis * g.menge)}</span></div>
      ${extrasHtml}
    `;
  }).join('');

  const lieferHtml = lieferkosten
    ? `<div class="liefer-zeile"><span>${lieferkosten.name}</span><span>${euro(lieferkosten.preis)}</span></div>`
    : '';

  return artikelHtml + lieferHtml;
}

function baueKontaktHtml(b) {
  let html = `
    <div class="kontakt-zeile"><i data-feather="phone"></i><span>${b.telefon}</span></div>
  `;
  if (b.bestellart !== "abholung") {
    html += `<div class="kontakt-zeile"><i data-feather="map-pin"></i><span>${b.adresse}</span></div>`;
  }
  if (b.hinweis) {
    html += `<div class="kontakt-zeile hinweis"><i data-feather="message-square"></i><span>${b.hinweis}</span></div>`;
  }
  return html;
}

function renderBestellungen(bestellungen) {
  const neu = bestellungen.filter(b => b.status === "eingegangen");
  const zubereitung = bestellungen.filter(b => b.status === "bestaetigt");

  document.getElementById("anzahl-neu").textContent = neu.length;
  document.getElementById("anzahl-zubereitung").textContent = zubereitung.length;

  const listeNeu = document.getElementById("liste-neu");
  const listeZubereitung = document.getElementById("liste-zubereitung");

  listeNeu.innerHTML = neu.length === 0
    ? `<div class="leer-hinweis">Aktuell keine neuen Bestellungen.</div>`
    : neu.map(b => renderNeueKarte(b)).join('');

  listeZubereitung.innerHTML = zubereitung.length === 0
    ? `<div class="leer-hinweis">Aktuell nichts in Zubereitung.</div>`
    : zubereitung.map(b => renderZubereitungsKarte(b)).join('');

  symbolePlatzieren();
}

function renderNeueKarte(b) {
  const { gruppen, lieferkosten } = gruppiereArtikel(b.artikel);
  const artikelHtml = baueArtikelHtml(gruppen, lieferkosten, "artikel-zeile", "extra-zeile");

  return `
    <div class="karte neu">
      <div class="karte-kopf">
        <div class="bestellart-abzeichen"><i data-feather="${bestellartIcon(b.bestellart)}"></i>${bestellartLabel(b.bestellart)}</div>
        <div class="karte-kopf-status">Neue Bestellung</div>
        <div class="karte-zeit">${formatiereZeit(b.erstellt_um)} Uhr<br>${vorXMinuten(b.erstellt_um)}</div>
      </div>
      <div class="karte-body">
        <div class="kunde-name">${b.name}</div>
        <div class="kontakt-zeilen">${baueKontaktHtml(b)}</div>
        <div class="artikel-block">
          ${artikelHtml}
          <div class="summen-zeile">
            <span class="zahlart-abzeichen ${b.zahlung === 'bar' ? 'bar' : 'online'}">${b.zahlung === 'bar' ? 'Barzahlung' : 'Online bezahlt'}</span>
            <span class="betrag">${euro(b.gesamt)}</span>
          </div>
        </div>
        <div class="zeit-bereich">
          <div class="zeit-hinweis">Bestellung annehmen – fertig in ...</div>
          <div class="zeit-grid">
            <button class="zeit-btn" onclick="zeitAuswaehlen('${b.order_id}', 15)">15 Min</button>
            <button class="zeit-btn" onclick="zeitAuswaehlen('${b.order_id}', 20)">20 Min</button>
            <button class="zeit-btn" onclick="zeitAuswaehlen('${b.order_id}', 30)">30 Min</button>
            <button class="zeit-btn" onclick="zeitAuswaehlen('${b.order_id}', 40)">40 Min</button>
            <button class="zeit-btn" onclick="zeitAuswaehlen('${b.order_id}', 45)">45 Min</button>
            <button class="zeit-btn" onclick="zeitAuswaehlen('${b.order_id}', 60)">60 Min</button>
          </div>
          <div class="zeit-eigene-zeile">
            <input type="number" min="1" id="eigene-${b.order_id}" placeholder="Eigene Minuten">
            <button onclick="eigeneZeitAuswaehlen('${b.order_id}')">Setzen</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderZubereitungsKarte(b) {
  const { gruppen, lieferkosten } = gruppiereArtikel(b.artikel);
  const artikelHtml = baueArtikelHtml(gruppen, lieferkosten, "artikel-zeile", "extra-zeile");

  const gesetztUm = new Date(b.eta_gesetzt_um);
  const fertigUm = new Date(gesetztUm.getTime() + b.eta_minuten * 60000);
  const restMinuten = Math.max(0, Math.round((fertigUm - new Date()) / 60000));

  return `
    <div class="karte zubereitung">
      <div class="karte-kopf">
        <div class="bestellart-abzeichen"><i data-feather="${bestellartIcon(b.bestellart)}"></i>${bestellartLabel(b.bestellart)}</div>
        <div class="karte-kopf-status">In Zubereitung</div>
        <div class="karte-zeit">${formatiereZeit(b.erstellt_um)} Uhr<br>${vorXMinuten(b.erstellt_um)}</div>
      </div>
      <div class="karte-body">
        <div class="kunde-name">${b.name}</div>
        <div class="kontakt-zeilen">${baueKontaktHtml(b)}</div>
        <div class="artikel-block">
          ${artikelHtml}
          <div class="summen-zeile">
            <span class="zahlart-abzeichen ${b.zahlung === 'bar' ? 'bar' : 'online'}">${b.zahlung === 'bar' ? 'Barzahlung' : 'Online bezahlt'}</span>
            <span class="betrag">${euro(b.gesamt)}</span>
          </div>
        </div>
        <div class="eta-anzeige">
          <div class="zeit-gross">${restMinuten > 0 ? 'ca. ' + restMinuten + ' Min.' : 'gleich fertig'}</div>
          <div class="zeit-detail">${bestellartLabel(b.bestellart) === 'Abholung' ? 'abholbereit' : 'fertig'} ca. ${formatiereZeit(fertigUm.toISOString())} Uhr &middot; angenommen um ${formatiereZeit(b.eta_gesetzt_um)} Uhr</div>
        </div>
        <button class="fertig-btn" onclick="alsFertigMarkieren('${b.order_id}')"><i data-feather="check"></i>Fertig / abgeschlossen</button>
      </div>
    </div>
  `;
}

// Klick auf eine Zeit = zentrale Annahmeaktion: Zettel sofort drucken (synchron,
// damit der Browser den Druckdialog als direkte Nutzeraktion zulässt) und
// parallel die Zeit am Server hinterlegen, damit der Kunde sie sieht.
function zeitAuswaehlen(orderId, minuten) {
  const bestellung = letzteBestellungen.find(b => b.order_id === orderId);
  if (bestellung) {
    druckeBestellung(bestellung, minuten);
  }
  etaAmServerSetzen(orderId, minuten);
}

function eigeneZeitAuswaehlen(orderId) {
  const wert = parseInt(document.getElementById(`eigene-${orderId}`).value, 10);
  if (!wert || wert <= 0) return;
  zeitAuswaehlen(orderId, wert);
}

async function etaAmServerSetzen(orderId, minuten) {
  await fetch(`${BACKEND_URL}/dashboard/api/bestellungen/${orderId}/eta`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": authHeader },
    body: JSON.stringify({ eta_minuten: minuten })
  });
  ladeBestellungen(false);
}

async function alsFertigMarkieren(orderId) {
  await fetch(`${BACKEND_URL}/dashboard/api/bestellungen/${orderId}/fertig`, {
    method: "POST",
    headers: { "Authorization": authHeader }
  });
  ladeBestellungen(false);
}

// Baut einen Bestellzettel und öffnet sofort/synchron den Druckdialog,
// damit der Klick auf den Zeit-Button als direkte Nutzeraktion zählt.
function druckeBestellung(b, etaMinuten) {
  const { gruppen, lieferkosten } = gruppiereArtikel(b.artikel);
  const artikelHtml = baueArtikelHtml(gruppen, lieferkosten, "druck-zeile", "druck-extra");

  const jetzt = new Date();
  const fertigUm = new Date(jetzt.getTime() + etaMinuten * 60000);
  const istAbholung = b.bestellart === "abholung";

  document.getElementById("druck-zettel").innerHTML = `
    <h2>Pizzeria Pinocchio</h2>
    <div class="druck-bestellart">${istAbholung ? 'Abholung' : 'Lieferung'}</div>
    <div class="druck-unterzeile">Bestellung #${b.order_id} &middot; gedruckt um ${formatiereZeit(jetzt.toISOString())} Uhr</div>
    <div class="druck-trennlinie"></div>
    <div class="druck-label">Kunde</div>
    <div class="druck-zeile"><span>${b.name}</span><span>${b.zahlung === 'bar' ? 'Barzahlung' : 'Online bezahlt'}</span></div>
    <div class="druck-zeile"><span>${b.telefon}</span><span></span></div>
    ${!istAbholung ? `<div class="druck-zeile"><span>${b.adresse}</span><span></span></div>` : ''}
    ${b.hinweis ? `<div class="druck-zeile"><span>Hinweis: ${b.hinweis}</span><span></span></div>` : ''}
    <div class="druck-trennlinie"></div>
    <div class="druck-label">Artikel</div>
    ${artikelHtml}
    <div class="druck-zeile druck-summe"><span>Gesamt</span><span>${euro(b.gesamt)}</span></div>
    <div class="druck-eta">${istAbholung ? 'Abholbereit' : 'Fertig'} in ca. ${etaMinuten} Min.<br><span style="font-weight:400; font-size:13px;">(ca. ${formatiereZeit(fertigUm.toISOString())} Uhr)</span></div>
  `;

  window.print();
}

// Automatisch eingeloggt bleiben, solange der Tab offen ist. Hinweis: dieser
// Pfad läuft OHNE frischen Klick auf "Anmelden", daher bleibt alarmAktiviert
// hier bewusst false - ohne echte Nutzeraktion in diesem Seitenaufruf würde
// der Browser eine automatische Audiofreischaltung ohnehin blockieren. Der
// Bestellalarm bleibt in diesem Fall stumm, bis entweder neu eingeloggt wird
// ODER (siehe Klick-Sicherheitsnetz weiter oben) die Bedienperson zum ersten
// Mal irgendwo ins Dashboard klickt - je nachdem, was zuerst passiert.
aktualisiereTonKnopf();
symbolePlatzieren();
const gespeicherteAuth = sessionStorage.getItem("dashboardAuth");
if (gespeicherteAuth) {
  authHeader = gespeicherteAuth;
  ladeBestellungen(false);
}

setInterval(() => ladeBestellungen(false), 10000);
</script>
</body>
</html>
